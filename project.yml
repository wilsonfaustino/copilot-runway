name: CopilotRunway
options:
  bundleIdPrefix: dev.wilsonfaustino
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  CopilotRunway:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wilsonfaustino.CopilotRunway
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Copilot Runway
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 Wilson Faustino. MIT License."
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
  Core:
    type: framework
    platform: macOS
    sources:
      - path: Core
        excludes: ["README.md"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wilsonfaustino.CopilotRunway.Core
        GENERATE_INFOPLIST_FILE: YES
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Tests read fixtures from the source folder by path, so they stay out of the bundle.
      - path: CoreTests
        excludes: ["Fixtures/**"]
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wilsonfaustino.CopilotRunway.CoreTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CopilotRunway:
    build:
      targets:
        CopilotRunway: all
        CoreTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets: [Core]
      targets: [CoreTests]
